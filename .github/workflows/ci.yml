name: CI

on: [push]

# Versions match upstream nerves_system_rpi3 v2.1.1, the base of this fork.
env:
  OTP_VERSION: 29.0.4
  ELIXIR_VERSION: 1.20.2-otp-29
  NERVES_BOOTSTRAP_VERSION: 1.16.0

permissions:
  id-token: write
  contents: read

jobs:
  get-br-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gridpoint-com/actions-nerves-system@v1
      - name: Get Buildroot Dependencies
        uses: ./.actions/get-br-dependencies
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
          nerves-bootstrap-version: ${{ env.NERVES_BOOTSTRAP_VERSION }}
          # Upstream pushes Buildroot sources to an S3 download mirror using
          # secrets.AWS_ROLE / vars.DOWNLOAD_SITE_BUCKET_URI. This fork has no
          # such bucket, so that step is off; the action then just runs
          # `make source` and relies on the GitHub Actions cache instead.
          push-to-download-site: false
  build-system:
    needs: [get-br-dependencies]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gridpoint-com/actions-nerves-system@v1
      - name: Build nerves_system
        uses: ./.actions/build-system
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
          nerves-bootstrap-version: ${{ env.NERVES_BOOTSTRAP_VERSION }}
  deploy-system:
    needs: [build-system]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: gridpoint-com/actions-nerves-system@v1
      # NOTE: this creates a DRAFT release. Nerves' artifact resolver cannot
      # see drafts, so after this job succeeds you must run:
      #   gh release edit vX.Y.Z --draft=false
      - name: Deploy nerves_system
        uses: ./.actions/deploy-system
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
